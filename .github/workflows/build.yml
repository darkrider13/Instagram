name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed so the workflow can publish a GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ig-webview-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ig-webview-app-debug
          path: ig-webview-app.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ig-webview-app.apk \
            --title "Build #${{ github.run_number }}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}" \
            --latest
