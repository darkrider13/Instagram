plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.igapp.webview'
    compileSdk 34

    defaultConfig {
        applicationId "com.igapp.webview"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed signing key (app/igapp.jks) so every build has the same signature
    // and a new APK installs over the old one without uninstalling.
    signingConfigs {
        igapp {
            storeFile file('igapp.jks')
            storePassword 'igapp123456'
            keyAlias 'igapp'
            keyPassword 'igapp123456'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.igapp
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.igapp
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
